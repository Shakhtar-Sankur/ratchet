name: ci
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - run: pip install numpy pytest && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: scripts/build_relay.sh --cpu
      - run: python -m pytest -q tests
